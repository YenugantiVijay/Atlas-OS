name: ATLAS OS CI

on:
  push:
    branches: [ main, master, Vijay-Atlas ]
  pull_request:
    branches: [ main, master, Vijay-Atlas ]

concurrency:
  group: atlas-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Advisory inventory only: classify before enforcing and upgrading packages.
      # This never changes the lockfile or blocks unrelated fixes.
      - name: Inventory production dependency advisories
        run: npm audit --omit=dev --audit-level=high || true

      - name: Inventory full dependency advisories
        run: npm audit --audit-level=high || true

      - name: Repository Hygiene & Secret Exposure Gate
        run: npm run audit:repository

      - name: ESLint & React Hooks Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Master Database Lifecycle & Security Acceptance
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: npm run test:db

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      # GitHub-hosted Ubuntu runners already include Chromium's system libraries.
      # --with-deps triggers apt package downloads and can hang/fail on DNS
      # outages at the Ubuntu mirror before any Playwright test starts.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run End-to-End Operational Tests (Playwright)
        run: npm run test:e2e
