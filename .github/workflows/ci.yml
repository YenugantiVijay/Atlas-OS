name: ATLAS OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, Vijay-Atlas ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint & React Hooks Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Master Database Lifecycle & Security Acceptance
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: npm run test:db

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Operational Tests (Playwright)
        run: npm run test:e2e
