name: ATLAS OS CI

on:
  push:
    branches: [ main, master, Vijay-Atlas ]
  pull_request:
    branches: [ main, master, Vijay-Atlas ]

concurrency:
  group: atlas-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Block critical advisories across all dependencies
        run: npm audit --audit-level=critical

      - name: Block high and critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Repository Hygiene & Secret Exposure Gate
        run: npm run audit:repository

      - name: Test migration history comparison
        run: node --test scripts/check-migration-parity.test.mjs

      - name: Verify staging integrity gate safety and fail-closed behavior
        run: node --test scripts/staging-financial-integrity.test.mjs

      - name: ESLint & React Hooks Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Use PostgreSQL 15 backup and restore clients
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-pg-tools"
          cat > "$RUNNER_TEMP/atlas-pg-tools/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            --env PGHOST --env PGHOSTADDR --env PGPORT --env PGUSER --env PGPASSWORD --env PGDATABASE \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            postgres:15-alpine "$(basename "$0")" "$@"
          SH
          chmod +x "$RUNNER_TEMP/atlas-pg-tools/pg_dump"
          ln -s pg_dump "$RUNNER_TEMP/atlas-pg-tools/pg_restore"
          echo "$RUNNER_TEMP/atlas-pg-tools" >> "$GITHUB_PATH"

      - name: Run Master Database Lifecycle & Security Acceptance
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
          ATLAS_TEST_RESTORE: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          npm run test:db 2>&1 | tee db-test.log || {
            tail -n 40 db-test.log | while IFS= read -r line; do
              echo "::error title=DB Test Failure::$line"
            done
            exit 1
          }

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      - name: Verify the private console builds separately
        run: |
          test ! -e dist/owner/index.html
          npm run build:owner
          test -f dist-owner/owner/index.html
          test ! -e dist-owner/index.html

      # GitHub-hosted Ubuntu runners already include Chromium's system libraries.
      # --with-deps triggers apt package downloads and can hang/fail on DNS
      # outages at the Ubuntu mirror before any Playwright test starts.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run End-to-End Operational Tests (Playwright)
        shell: bash
        run: |
          npx playwright test --reporter=list 2>&1 | tee playwright.log || {
            tail -n 60 playwright.log | while IFS= read -r line; do
              echo "::error title=Playwright Test Failure::$line"
            done
            exit 1
          }
