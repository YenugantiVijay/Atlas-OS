<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Atlas OS sign-in code</title>
</head>
<body style="margin:0;background:#f4f7fb;color:#142b4d;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb">
    <tr><td align="center" style="padding:32px 16px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border:1px solid #dbe3ee;border-radius:16px">
        <tr><td style="padding:26px 28px 8px;font-size:17px;font-weight:bold">ATLAS <span style="color:#0f766e">OS</span></td></tr>
        <tr><td style="padding:8px 28px 28px">
          <h1 style="margin:0 0 12px;font-size:24px">Your Atlas OS sign-in code</h1>
          <p style="font-size:15px;line-height:1.5">Enter this six-digit code in Atlas OS to sign in.</p>
          <p style="margin:20px 0;padding:16px;background:#eef9f7;border:1px solid #bee6df;border-radius:10px;text-align:center;font-size:28px;font-weight:bold;letter-spacing:5px;color:#142b4d">{{ .Token }}</p>
          <p style="font-size:13px;line-height:1.5;color:#475569">This code expires after a short time. Keep it private. If you did not request it, you can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
